name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly 07:00 UTC — drives the `longhaul` soak job only.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  spec-freshness:
    name: Spec freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate compares the complete pushed/PR range, not filesystem
          # mtimes, so both endpoints must be present locally.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require colocated spec updates
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          python tools/check_spec_freshness.py --base "$BASE_SHA" --head "$HEAD_SHA"

  lint:
    needs: spec-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check src tests

  unit:
    needs: spec-freshness
    # The release workflow (.github/workflows/release.yml) runs
    # ``pytest tests/unit`` on Windows (x64 + ARM64) as a gate BEFORE
    # building the redistributable, but CI historically did NOT — only
    # lint + the smoke/scanner matrix + perf-gate. So a broken unit test
    # sailed through a green CI and only surfaced when the ``vX.Y.Z`` tag
    # was pushed, failing the Release at "Run unit tests (clean env)"
    # (v0.4.0 / v0.3.11 / v0.3.8 all hit this, each needing a follow-up
    # fix push). Running the unit suite here closes that gap so unit
    # breakage is caught on the merge that introduces it.
    #
    # Windows-only, mirroring the release's unit gate exactly. The suite
    # contains GUI-geometry tests (auto-stack ConditionFrame
    # classification, field-picker pixel widths, modal footer layout —
    # CLAUDE.md §7.19) whose assertions are CALIBRATED for Windows
    # font/widget metrics; under a headless Linux xvfb display they read
    # different pixel sizes and produce false failures, and the release
    # never unit-tests on Linux/macOS anyway. Runs as its OWN pytest
    # invocation to mirror the release's isolation. Env is otherwise clean
    # (no TRADINGLAB_* vars) so the per-test ``tmp_path`` redirection isn't
    # shadowed (release.yml documents the same constraint).
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - name: Run unit tests
        run: pytest tests/unit -q
      # Previously-orphaned suites: these deterministic logic suites
      # (core / data / entries / exits / positions / streaming) and the
      # tests/gui widget suite existed but were run by NO CI job or the
      # release gate — a regression in that code sailed through green CI.
      # Wired in here (Windows, mirroring the unit gate + the release
      # gate below). Pure-logic suites run as one invocation; tests/gui
      # runs in its OWN interpreter so its Tk-object GC can't race the
      # other suites' teardown (the Tcl_AsyncDelete cross-suite hazard
      # documented in release.yml).
      - name: Run logic suites (core/data/entries/exits/positions/streaming)
        run: pytest tests/core tests/data tests/entries tests/exits tests/positions tests/streaming -q
      - name: Run gui widget suite (isolated interpreter)
        run: pytest tests/gui -q

  coverage:
    needs: spec-freshness
    # Informational coverage report — NOT a gate. Runs the deterministic,
    # offline unit + scanner suites on Windows/3.12 (the same platform the
    # release unit-gates on, so the pixel-calibrated GUI-geometry tests
    # read true), prints a term-missing summary, and uploads coverage.xml.
    # Main runs also retain separate statement/branch counts for 90 days and
    # compare only trustworthy, compatible ancestor runs in the step summary.
    # ``continue-on-error`` keeps this producer/report informational. Unit
    # tests and the separate changed-line consumer remain blocking; there
    # is no global ``--cov-fail-under`` threshold.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      # A downstream rerun must use the producer's attempt, not its own.
      summary_artifact: ${{ steps.coverage_artifact.outputs.summary_artifact }}
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          # Baseline ancestry and source-tree checks must not use shallow history.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Name coverage summary artifact
        id: coverage_artifact
        run: '"summary_artifact=coverage-summary-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT'
      - name: Run tests with coverage
        id: coverage_measurement
        run: python tools/report_coverage_trend.py measure -- pytest tests/unit tests/scanner tests/core tests/data tests/entries tests/exits tests/positions tests/streaming tests/oracles --cov=tradinglab --cov-report=xml --cov-report=term-missing:skip-covered -q
      - name: Report main coverage trend (informational)
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.coverage_measurement.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/report_coverage_trend.py report
      - name: Persist coverage measurement (90-day history)
        # PR artifacts carry provenance for same-run consumers, but are never baselines.
        if: always() && steps.coverage_artifact.outputs.summary_artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.coverage_artifact.outputs.summary_artifact }}
          path: coverage-summary.json
          retention-days: 90
          if-no-files-found: warn
      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          # Rerunning this producer replaces the previous attempt's raw XML.
          overwrite: true

  gui-coverage:
    name: GUI-only coverage (informational)
    needs: spec-freshness
    # Keep tests/gui in its own interpreter/job: mixing its Tk-object GC
    # with the unit/logic suites risks Tcl_AsyncDelete during teardown.
    # This score is GUI-only, NOT total/unit coverage; never combine its
    # data with the coverage job's baseline. The unit GUI gate stays intact.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
      COVERAGE_FILE: ${{ runner.temp }}\.coverage.gui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Explain GUI-only coverage scope
        shell: pwsh
        run: |
          @'
          ### GUI-only coverage (`tests/gui`)

          Informational Windows/Python 3.12 measurement of `tradinglab` through `tests/gui` only, in an isolated interpreter. This is not `tests/unit/gui` and excludes the unit, logic, oracle and full smoke suites.

          Do not compare this score with total/unit coverage or merge these artifacts into the unit baseline. Skipped Tk tests contribute no execution; pytest prints skip reasons in the job log. The existing `unit` job's isolated GUI invocation remains the gate.
          '@ | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Run GUI-only coverage (isolated interpreter; show skip reasons)
        shell: pwsh
        run: python -m pytest tests\gui --cov=tradinglab --cov-report="xml:$env:RUNNER_TEMP\coverage-gui.xml" --cov-report=term-missing:skip-covered -q -ra
      - name: Upload GUI-only raw coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-gui-raw
          path: ${{ runner.temp }}\.coverage.gui
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload GUI-only coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-gui-xml
          path: ${{ runner.temp }}\coverage-gui.xml
          if-no-files-found: error

  changed-line-coverage:
    name: Changed executable lines (70% minimum)
    needs: [spec-freshness, coverage]
    # The producer is informational; this independent consumer must fail
    # on insufficient coverage or missing/invalid evidence. Scheduled and
    # manual runs have no event diff, so they do not invent a comparison.
    if: ${{ !cancelled() && needs.spec-freshness.result == 'success' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PYTHONIOENCODING: utf-8
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require measurement provenance identity
        shell: pwsh
        env:
          PROVENANCE_ARTIFACT: ${{ needs.coverage.outputs.summary_artifact }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROVENANCE_ARTIFACT)) {
            throw "The coverage producer did not publish a measurement artifact identity."
          }
      - name: Download measured coverage XML
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml
      - name: Download matching measurement provenance
        uses: actions/download-artifact@v8
        with:
          # Use the producer's attempt, including when only this job is rerun.
          name: ${{ needs.coverage.outputs.summary_artifact }}
      - name: Enforce changed-line coverage
        shell: pwsh
        run: python tools\check_changed_coverage.py --xml coverage.xml --provenance coverage-summary.json --base "$env:BASE_SHA" --head "$env:HEAD_SHA" --expected-suite unit-scanner-logic-oracles-v1 --minimum 70 --enforce --json-out "$env:RUNNER_TEMP\coverage-changed.json"
      - name: Upload changed-line coverage result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-line-coverage
          path: ${{ runner.temp }}\coverage-changed.json
          if-no-files-found: error

  smoke:
    needs: spec-freshness
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    # Hard ceiling: a hung Tk / future-poll loop on macOS-latest previously
    # left jobs `in_progress` for the runner's 6-hour default. 30 minutes
    # is well above the ~10 min real wall-clock for the suite locally.
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -e .[dev]
      - name: Run smoke + scanner tests
        if: runner.os != 'Linux'
        run: pytest tests/smoke tests/scanner -v --tb=short
      - name: Run smoke + scanner tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/smoke tests/scanner -v --tb=short

  oracles:
    needs: spec-freshness
    # Differential + metamorphic oracles (tests/oracles). Pure-logic and
    # headless — no Tk, no matplotlib canvas, no wall-clock waits — so a
    # single fast Linux runner is sufficient and there is no need for the
    # 3-OS smoke matrix. Runs on every push/PR because it is ~2 seconds.
    #
    # These are the suites that assert two routes to the same truth agree
    # (causality f(B[:k]) == f(B)[:k], aggregate(fine) == fetch(coarse),
    # store round-trip identity). They carry their own anti-vacuity guards
    # and a mutation canary, so a green result here means the oracles can
    # actually fail — which line coverage alone can never tell you.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Run oracle suites
        run: pytest tests/oracles -m oracle -v --tb=short
      - name: Run market-fixture contract tests
        run: pytest tests/unit/test_market_sim.py -q

  longhaul:
    needs: spec-freshness
    # Long-horizon soak. Deliberately does NOT restore state between steps,
    # which is the inverse of the smoke suite's per-check `finally` discipline
    # and therefore the only place accumulation bugs (unbounded caches, NaN
    # creep, heap drift) can surface.
    #
    # Nightly + manual only: it is excluded from the default pytest session by
    # the `longhaul` marker, and running it on every PR would buy little (it
    # is deterministic, so it only changes when the code does) while adding
    # minutes to the critical path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Run long-horizon soak
        run: pytest tests/longhaul -m longhaul -v --tb=short

  perf-gate:
    needs: spec-freshness
    # Indicator perf-budget regression gate (see docs/PERFORMANCE.md +
    # CLAUDE.md §7.27). Opt-in marker so the default smoke matrix
    # stays fast; runs unconditionally on push to main so any
    # accidentally-merged regression surfaces immediately, and on
    # every PR — the suite is <1 second so the cost is negligible.
    # Budgets are sized at 4× the v0.3.0 ARM64 baseline so the gate
    # tolerates the Linux x86 runner's different micro-architecture.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Run indicator perf-budget gates
        run: pytest tests/perf -m perf -v --tb=short
